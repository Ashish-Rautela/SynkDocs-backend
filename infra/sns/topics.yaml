AWSTemplateFormatVersion: '2010-09-09'
Description: SNS Topics for SynkDocs Backend Notifications

Resources:
  DocumentNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'SynkDocs-DocumentNotifications-${AWS::StackName}'

Outputs:
  TopicArn:
    Value: !Ref DocumentNotificationsTopic
    Export:
      Name: SynkDocs-NotificationTopicArn
