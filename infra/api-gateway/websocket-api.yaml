AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: WebSocket API Gateway for SynkDocs Real-Time Collaboration

Resources:
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'SynkDocs-WebSocketApi-${AWS::StackName}'
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: Prod
      AutoDeploy: true

Outputs:
  WebSocketApiId:
    Value: !Ref WebSocketApi
  WebSocketStageName:
    Value: Prod
