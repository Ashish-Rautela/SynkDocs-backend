AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Auth Microservice SAM Template

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        USERS_TABLE: !ImportValue SynkDocs-UsersTable
        EVENT_BUS_NAME: !ImportValue SynkDocs-EventBusName
        JWT_SECRET: synkdocs_dev_secret_key


Resources:
  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/register/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        RegisterApi:
          Type: Api
          Properties:
            Path: /register
            Method: post

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/login/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        LoginApi:
          Type: Api
          Properties:
            Path: /login
            Method: post

  LogoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/logout/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        LogoutApi:
          Type: Api
          Properties:
            Path: /logout
            Method: post

  RefreshTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/refreshToken/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        RefreshTokenApi:
          Type: Api
          Properties:
            Path: /refresh-token
            Method: post

  VerifyTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/verifyToken/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        VerifyTokenApi:
          Type: Api
          Properties:
            Path: /verify-token
            Method: post

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/authservice/functions/health/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /health
            Method: get

