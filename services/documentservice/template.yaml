AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Document Microservice SAM Template

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 15
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        DOCUMENTS_TABLE: !ImportValue SynkDocs-DocumentsTable
        PERMISSIONS_TABLE: !ImportValue SynkDocs-PermissionsTable
        VERSIONS_TABLE: !ImportValue SynkDocs-VersionsTable
        EVENT_BUS_NAME: !ImportValue SynkDocs-EventBusName
        SNAPSHOT_BUCKET_NAME: synkdocs-snapshots-bucket

x-doc-policies: &doc-policies
  - Statement:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
        Resource:
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
      - Effect: Allow
        Action:
          - events:PutEvents
        Resource: '*'
      - Effect: Allow
        Action:
          - s3:GetObject
          - s3:PutObject
          - s3:DeleteObject
          - s3:ListBucket
        Resource: '*'

Resources:
  CreateDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/createDocument/index.handler
      Policies: *doc-policies
      Events:
        CreateDocApi:
          Type: Api
          Properties:
            Path: /documents
            Method: post

  DeleteDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/deleteDocument/index.handler
      Policies: *doc-policies
      Events:
        DeleteDocApi:
          Type: Api
          Properties:
            Path: /documents/{id}
            Method: delete

  RenameDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/renameDocument/index.handler
      Policies: *doc-policies
      Events:
        RenameDocApi:
          Type: Api
          Properties:
            Path: /documents/{id}
            Method: put

  GetDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/getDocument/index.handler
      Policies: *doc-policies
      Events:
        GetDocApi:
          Type: Api
          Properties:
            Path: /documents/{id}
            Method: get

  ListDocumentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/listDocuments/index.handler
      Policies: *doc-policies
      Events:
        ListDocsApi:
          Type: Api
          Properties:
            Path: /documents
            Method: get

  SaveSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/saveSnapshot/index.handler
      Policies: *doc-policies
      Events:
        SaveSnapshotApi:
          Type: Api
          Properties:
            Path: /documents/{id}/snapshot
            Method: post

  RestoreSnapshotFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/documentservice/functions/restoreSnapshot/index.handler
      Policies: *doc-policies
      Events:
        RestoreSnapshotApi:
          Type: Api
          Properties:
            Path: /documents/{id}/snapshot/restore
            Method: post
