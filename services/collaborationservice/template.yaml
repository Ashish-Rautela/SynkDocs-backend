AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Collaboration WebSocket Microservice SAM Template

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        CONNECTIONS_TABLE: !ImportValue SynkDocs-ConnectionsTable
        DOCUMENTS_TABLE: !ImportValue SynkDocs-DocumentsTable
        PERMISSIONS_TABLE: !ImportValue SynkDocs-PermissionsTable

x-collab-policies: &collab-policies
  - Statement:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
        Resource:
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'

Resources:
  ConnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/connect/index.handler
      Policies: *collab-policies

  DisconnectFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/disconnect/index.handler
      Policies: *collab-policies

  SendOperationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/sendOperation/index.handler
      Policies: *collab-policies

  CursorPositionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/cursorPosition/index.handler
      Policies: *collab-policies

  HeartbeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/heartbeat/index.handler
      Policies: *collab-policies

  ActiveUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/collaborationservice/functions/activeUsers/index.handler
      Policies: *collab-policies
      Events:
        ActiveUsersApi:
          Type: Api
          Properties:
            Path: /documents/{id}/active-users
            Method: get
