AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Expense Tracker Microservice SAM Template

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
      AllowOrigin: "'*'"
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        EXPENSES_TABLE: !ImportValue SynkDocs-ExpensesTable
        JWT_SECRET: synkdocs_dev_secret_key

Resources:
  ExpenseHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/expenseservice/functions/expenseHandler/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
      Events:
        ExpenseApi:
          Type: Api
          Properties:
            Path: /expenses
            Method: post
