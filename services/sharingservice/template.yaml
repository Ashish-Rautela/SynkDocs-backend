AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sharing Microservice SAM Template

Globals:
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key'"
      AllowOrigin: "'*'"
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        PERMISSIONS_TABLE: !ImportValue SynkDocs-PermissionsTable
        DOCUMENTS_TABLE: !ImportValue SynkDocs-DocumentsTable
        USERS_TABLE: !ImportValue SynkDocs-UsersTable
        EVENT_BUS_NAME: !ImportValue SynkDocs-EventBusName


Resources:
  ShareDocumentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/sharingservice/functions/shareDocument/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        ShareDocApi:
          Type: Api
          Properties:
            Path: /documents/share
            Method: post

  RevokeAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/sharingservice/functions/revokeAccess/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        RevokeAccessApi:
          Type: Api
          Properties:
            Path: /documents/share
            Method: delete

  UpdatePermissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/sharingservice/functions/updatePermission/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        UpdatePermissionApi:
          Type: Api
          Properties:
            Path: /documents/permission
            Method: put

  GetCollaboratorsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/sharingservice/functions/getCollaborators/index.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
                - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
            - Effect: Allow
              Action:
                - events:PutEvents
              Resource: '*'
      Events:
        GetCollaboratorsApi:
          Type: Api
          Properties:
            Path: /documents/{id}/collaborators
            Method: get
