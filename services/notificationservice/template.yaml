AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Notification Microservice SAM Template

Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 10
    MemorySize: 256
    CodeUri: ../../
    Environment:
      Variables:
        EVENT_BUS_NAME: !ImportValue SynkDocs-EventBusName
        SNS_TOPIC_ARN: !ImportValue SynkDocs-NotificationTopicArn

x-notification-policies: &notification-policies
  - Statement:
      - Effect: Allow
        Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          - dynamodb:DeleteItem
          - dynamodb:Query
          - dynamodb:Scan
        Resource:
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*'
          - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/SynkDocs-*/index/*'
      - Effect: Allow
        Action:
          - events:PutEvents
          - sns:Publish
        Resource: '*'

Resources:
  DocumentSharedNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/notificationservice/functions/documentShared/index.handler
      Policies: *notification-policies
      Events:
        DocumentSharedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: !ImportValue SynkDocs-EventBusName
            Pattern:
              detail-type:
                - DocumentShared

  CommentNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/notificationservice/functions/commentNotification/index.handler
      Policies: *notification-policies
      Events:
        CommentAddedRule:
          Type: EventBridgeRule
          Properties:
            EventBusName: !ImportValue SynkDocs-EventBusName
            Pattern:
              detail-type:
                - CommentAdded

  MentionNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/notificationservice/functions/mentionNotification/index.handler
      Policies: *notification-policies

  SendEmailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: services/notificationservice/functions/sendEmail/index.handler
      Policies: *notification-policies
      Events:
        SnsTopicTrigger:
          Type: SNS
          Properties:
            Topic: !ImportValue SynkDocs-NotificationTopicArn
